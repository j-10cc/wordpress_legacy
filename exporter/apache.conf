# BEGIN WordPress Legacy Exporter
DirectoryIndex index.html
# The dispatcher supplies charset parameters except for WebExplorer's bare MIME type.
AddDefaultCharset Off
RewriteEngine On
RewriteRule ^editions(?:/|$) - [R=404,L]
RewriteRule ^(?:$|index(?:[2-9]|[1-9][0-9]+)?\.html$|post_[0-9]+\.html$) dispatch.php [END]
# END WordPress Legacy Exporter
